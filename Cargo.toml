[package]
name = "vapour-protocol"
version = "0.2.0"
edition = "2024"
description = "Steam client protocol implementation (v0.2+)"
license = "MIT"
build = "build.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
flate2 = "1"
futures-util = "0.3"
prost = "0.14"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"
